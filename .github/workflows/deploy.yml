name: Build and Push to GHCR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    # packages: write is only exercised by the push-to-main steps below.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Ruff check
        run: python -m ruff check .

      - name: ESLint
        run: npm run lint

      - name: Backend tests
        run: python -m pytest -q --cov=. --cov-report=term-missing --cov-fail-under=90

      - name: Frontend tests
        run: npm test -- --ci

      - name: npm audit
        run: npm audit --audit-level=high

      - name: pip-audit
        run: python -m pip_audit -r requirements.txt -r requirements-dev.txt --strict

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      # Built once; this exact image is smoke-tested and then pushed.
      - name: Docker build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: growth-calc:ci
          labels: ${{ steps.meta.outputs.labels }}

      - name: Docker smoke test
        run: |
          docker run -d --name growth-calc-smoke -p 18080:8080 growth-calc:ci
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then echo "Container never became healthy"; exit 1; fi
          curl -fsS http://127.0.0.1:18080/health | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('status')=='healthy', d"
          curl -fsS -X POST http://127.0.0.1:18080/calculate \
            -H 'Content-Type: application/json' \
            -d '{"sex":"female","birth_date":"2020-01-15","measurement_date":"2026-09-01","height":112,"reference":"uk-who"}' \
            | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['success'] is True, d; s=d['results']['height']['sds']; assert abs(s-(-1.396))<0.01, s; print('height SDS', s)"
          curl -fsS -o /dev/null http://127.0.0.1:18080/static/vendor/chart.umd.min.js

      - name: Smoke test logs and cleanup
        if: always()
        run: |
          docker logs growth-calc-smoke || true
          docker rm -f growth-calc-smoke || true

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          # Newline-separated; expanding it inline in the script breaks the shell.
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for t in $TAGS; do
            docker tag growth-calc:ci "$t"
            docker push "$t"
          done
